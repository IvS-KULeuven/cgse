BaseClass:
    egse.power_supply.rs_pro.rsd3305p.Rsd3305pInterface

ProxyClass:
    egse.power_supply.rs_pro.rsd3305p.Rsd3305pProxy

ControlServerClass:
    egse.power_supply.rs_pro.rsd3305p_cs.Rsd3305pControlServer

ControlServer:
    egse.power_supply.rs_pro.rsd3305p_cs

#UserInterface:
#    egse.power_supply.rs_pro.rsd3305p_ui

Commands:

    # Definition of the DeviceInterface

    is_simulator:
        description: Ask if the connected class is a simulator instead of the real device Controller class.
        returns: bool | True if the far end is a simulator instead of the real hardware

    is_connected:
        description: Check if the RS-PRO RS-D3305P hardware controller is connected.

    connect:
        description: Connect the RS-PRO RS-D3305P hardware controller

    reconnect:
        description: Reconnect the RS-PRO RS-D3305P hardware controller.
            
            This command will force a disconnect and then try to re-connect to the controller.

    disconnect:
        description: Disconnect from the RS-PRO RS-D3305P hardware controller.
            
            This command will be send to the RS-PRO RS-D3305P Control Server which will then
            disconnect from the hardware controller.
            
            This command does not affect the ZeroMQ connection of the Proxy to the
            control server. Use the service command `disconnect_cs()` to disconnect
            from the control server.
